<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kloe Beauty | Tienda Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-kloe: #E999B7;
            --rosa-claro: #fdf2f5;
            --negro-soft: #1a1a1a;
            --blanco: #ffffff;
            --sombra-suave: 0 8px 30px rgba(0,0,0,0.05);
            --transicion: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background-color: #fafafa;
            color: var(--negro-soft);
            overflow-x: hidden;
        }

        /* --- HEADER SUTIL --- */
        header {
            background-color: var(--negro-soft);
            padding: 40px 20px;
            text-align: center;
            clip-path: ellipse(150% 100% at 50% 0%); /* Curva sutil en el fondo */
        }

        
        .logo-contenedor {
        width: 150px; /* Ajustamos el tamaño para que se vea bien el logo */
        height: 150px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Efecto de resplandor rosa suave detrás de tu logo */
        filter: drop-shadow(0 0 15px rgba(233, 153, 183, 0.6)); 
        animation: floating 3s ease-in-out infinite;
        }

        .logo-imagen {
        width: 100%; /* La imagen ocupará todo el contenedor */
    height: auto;
    border-radius: 50%; /* Como tu logo es circular, esto ayuda a que encaje perfecto */
}

        .logo-texto {
            font-family: 'Dancing Script', cursive;
            color: white;
            font-size: 2.2rem;
            margin: 15px 0 0 0;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- DASHBOARD NOVEDOSO --- */
        .dashboard {
            max-width: 900px;
            margin: -30px auto 40px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--sombra-suave);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .filtros-scroll {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-filtro {
            border: none;
            background: var(--rosa-claro);
            color: var(--rosa-kloe);
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transicion);
            border: 1px solid transparent;
        }

        .btn-filtro:hover, .btn-filtro.activo {
            background: var(--rosa-kloe);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(233, 153, 183, 0.3);
        }

        /* --- GRID DE PRODUCTOS --- */
        .contenedor {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            box-shadow: var(--sombra-suave);
            transition: var(--transicion);
            opacity: 0; /* Para la animación de entrada */
            transform: translateY(20px);
            border: 1px solid #f0f0f0;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .img-placeholder {
            width: 100%;
            height: 200px;
            background: var(--rosa-claro);
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--rosa-kloe);
            font-size: 0.8rem;
            font-weight: bold;
        }

        .card h3 {
            font-size: 1.1rem;
            margin: 10px 0;
            font-weight: 400;
        }

        .precio {
            color: var(--negro-soft);
            font-weight: 600;
            font-size: 1.2rem;
            display: block;
            margin-bottom: 15px;
        }

        .btn-comprar {
            background: var(--negro-soft);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            transition: var(--transicion);
        }

        .btn-comprar:hover {
            background: var(--rosa-kloe);
        }
        /* Botón flotante del carrito */
        .carrito-flotante {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--rosa-kloe);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
            transition: var(--transicion);
        }

        .contador-badge {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--negro-soft);
            padding: 5px 10px;
            border-radius: 50%;
            font-size: 0.8rem;
        }

        /* Panel del Carrito */
        .carrito-panel {
            position: fixed;
            top: 0;
            right: -400px; /* Escondido por defecto */
            width: 350px;
            height: 100%;
            background: white;
            box-shadow: -5px 0 30px rgba(0,0,0,0.1);
            z-index: 2000;
            transition: var(--transicion);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .carrito-panel.abierto {
            right: 0;
        }

        .lista-carrito {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 20px;
        }

        .item-carrito {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .total-seccion {
            border-top: 2px solid var(--rosa-claro);
            padding-top: 20px;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
    <div class="logo-contenedor">
        <img src="Kloe-logo.jpg" alt="Kloe Beauty Logo" class="logo-imagen">
    </div>
    <h1 class="logo-texto">Kloe Beauty</h1>
    </header>

    <section class="dashboard">
        <div class="filtros-scroll" id="filtros">
            <button class="btn-filtro activo" onclick="filtrar('todos')">Todos</button>
            <button class="btn-filtro" onclick="filtrar('labiales')">Labiales</button>
            <button class="btn-filtro" onclick="filtrar('rostro')">Rostro</button>
            <button class="btn-filtro" onclick="filtrar('ojos')">Ojos</button>
             <button class="btn-filtro" onclick="filtrar('cabello')">Cabello</button>
        </div>
    </section>

    <main class="contenedor">
        <div class="grid-productos" id="lista-productos">
            </div>
    </main>

    <script>
    const formatoCOP = new Intl.NumberFormat('es-CO', {
        style: 'currency',
        currency: 'COP',
        minimumFractionDigits: 0
    });

    const URL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTwgcsxDAYDYMqWZ5qkl65R_Jpzg-FeKu8G-8HxegRO2wsaQqRSIzbJfS_iL_VDUGFumMyiA6SR2mAa/pub?output=csv";

    let productos = [];

    async function cargarProductos() {
        try {
            const respuesta = await fetch(URL_GOOGLE_SHEETS);
            const datosCSV = await respuesta.text();
            
            // Usamos una expresión regular para separar por comas de forma segura
            const filas = datosCSV.split(/\r?\n/).slice(1);
            
            productos = filas.map(fila => {
                // Esta línea separa las columnas respetando si hay comas dentro de comillas
                const columnas = fila.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                
                if (!columnas || columnas.length < 3) return null;

                return {
                    id: parseInt(columnas[0].replace(/"/g, '')),
                    nombre: columnas[1].replace(/"/g, '').trim(),
                    precio: parseInt(columnas[2].replace(/"/g, '')),
                    cat: columnas[3] ? columnas[3].replace(/"/g, '').trim().toLowerCase() : 'otros',
                    // Limpiamos el enlace de la foto por si tiene comillas
                    foto: columnas[4] ? columnas[4].replace(/"/g, '').trim() : ''
                };
            }).filter(p => p !== null);

            console.log("Productos procesados:", productos);
            renderizar(productos); 
        } catch (error) {
            console.error("Error cargando Excel:", error);
        }
    }

    cargarProductos();
</script>
    <!-- Carrito flotante y panel fuera de cualquier <script> y antes de </body> -->
    <div class="carrito-flotante" onclick="toggleCarrito()">
        🛒 <span class="contador-badge" id="cart-count">0</span>
    </div>

    <div class="carrito-panel" id="cart-panel">
        <button onclick="toggleCarrito()" style="border:none; background:none; cursor:pointer; font-size:1.5rem;">✕</button>
        <h2>Tu Carrito</h2>
        <div class="lista-carrito" id="cart-items">
        </div>
        <div class="total-seccion">
            <h3>Total: <span id="cart-total">$ 0</span></h3>
            <button class="btn-whatsapp" onclick="enviarWhatsApp()">Finalizar pedido por WhatsApp</button>
        </div>
    </div>

    <script>
        let carrito = [];
        const numeroWhatsApp = "573204390327"; // ¡CAMBIA ESTO POR TU NÚMERO! (Código país + número)

        // Función para agregar al carrito
        function agregarAlCarrito(id) {
            const producto = productos.find(p => p.id === id);
            carrito.push(producto);
            actualizarInterfaz();
            

        }

        function actualizarInterfaz() {
            // Actualizar contador
            document.getElementById('cart-count').innerText = carrito.length;

            // Actualizar lista visual
            const listaHTML = document.getElementById('cart-items');
            listaHTML.innerHTML = '';
            let total = 0;

            carrito.forEach((p, index) => {
                total += p.precio;
                listaHTML.innerHTML += `
                    <div class="item-carrito">
                        <span>${p.nombre}</span>
                        <span>${formatoCOP.format(p.precio)}</span>
                        <button onclick="eliminarDelCarrito(${index})" style="border:none; color:red; cursor:pointer;">🗑️</button>
                    </div>
                `;
            });

            document.getElementById('cart-total').innerText = formatoCOP.format(total);
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarInterfaz();
        }

        function toggleCarrito() {
            document.getElementById('cart-panel').classList.toggle('abierto');
        }

        function enviarWhatsApp() {
            if (carrito.length === 0) return alert("El carrito está vacío");

            let mensaje = "¡Hola Kloe Beauty! ✨ Quisiera hacer un pedido:\n\n";
            let total = 0;
            
            carrito.forEach(p => {
                mensaje += `- ${p.nombre} (${formatoCOP.format(p.precio)})\n`;
                total += p.precio;
            });

            mensaje += `\n*Total: ${formatoCOP.format(total)}*`;
            
            // Codificar para URL
            const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        // Modifica tu función de renderizar para que el botón llame a agregarAlCarrito
        function renderizar(lista) {
    const contenedor = document.getElementById('lista-productos');
    contenedor.innerHTML = '';

    lista.forEach((p, index) => {
        // Si el producto no tiene foto, usamos una por defecto
        const imagenUrl = p.foto && p.foto.includes('http') ? p.foto : 'Kloe-logo.jpg';

        const html = `
            <div class="card" style="transition-delay: ${index * 0.1}s">
                <div class="contenedor-img" style="width: 100%; height: 200px; overflow: hidden; border-radius: 15px; background: #fdf2f5;">
                    <img src="${imagenUrl}" 
                         onerror="this.src='Kloe-logo.jpg'" 
                         loading="lazy" 
                         style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h3>${p.nombre}</h3>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                    <span class="precio">${formatoCOP.format(p.precio)}</span>
                    <button class="btn-comprar" onclick="agregarAlCarrito(${p.id})" style="width: auto; padding: 8px 12px; font-size: 0.8rem;">Añadir</button>
                </div>
            </div>
        `;
        contenedor.insertAdjacentHTML('beforeend', html);
    });

    setTimeout(() => {
        document.querySelectorAll('.card').forEach(c => c.classList.add('visible'));
    }, 100);

}
        

        // Inicializar con todos los productos
        renderizar(productos);
    </script>

</body>
