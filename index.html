<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kloe Beauty | Tienda Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta de colores aplicada según la imagen */
            --rosa-kloe: #671A21;      /* Vino principal */
            --rosa-claro: #ECD9D2;     /* Nude claro */
            --negro-soft: #000000;     /* Negro */
            --prueba-menu: #57171E;    /* Vino oscuro */
            --nude-medio: #E0C5BB;     /* Nude piel */
            --blanco: #ffffff;
            --sombra-suave: 0 8px 30px rgba(0,0,0,0.05);
            --transicion: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background-color: #fafafa;
            color: var(--negro-soft);
            overflow-x: hidden;
        }

        header {
            background-color: var(--prueba-menu);
            padding: 40px 20px;
            text-align: center;
            clip-path: ellipse(150% 100% at 50% 0%);
        }

        .logo-contenedor {
            width: 150px;
            height: 150px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 15px rgba(103, 26, 33, 0.4)); 
            animation: floating 3s ease-in-out infinite;
        }

        .logo-imagen {
            width: 100%;
            height: auto;
            border-radius: 50%;
        }

        .logo-texto {
            font-family: 'Dancing Script', cursive;
            color: var(--nude-medio);
            font-size: 2.5rem;
            margin: 15px 0 0 0;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .dashboard {
            max-width: 900px;
            margin: -30px auto 40px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--sombra-suave);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .filtros-scroll {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-filtro {
            border: none;
            background: var(--rosa-claro);
            color: var(--rosa-kloe);
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transicion);
        }

        .btn-filtro:hover, .btn-filtro.activo {
            background: var(--rosa-kloe);
            color: white;
            transform: scale(1.05);
        }

        .contenedor {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            box-shadow: var(--sombra-suave);
            transition: var(--transicion);
            opacity: 0;
            transform: translateY(20px);
            border: 1px solid #f0f0f0;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card:hover { transform: translateY(-10px); }

        .btn-comprar {
            background: var(--negro-soft);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            transition: var(--transicion);
            font-weight: 600;
        }

        .btn-comprar:hover:not(:disabled) { background: var(--rosa-kloe); }

        /* Estilos de los Tonos */
        .contenedor-tonos {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .circulo-tono {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            transition: var(--transicion);
        }

        .circulo-tono.seleccionado {
            border-color: var(--negro-soft);
            transform: scale(1.2);
            box-shadow: 0 0 12px rgba(0,0,0,0.2);
        }

        .carrito-flotante {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--negro-soft);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 1000;
        }

        .contador-badge {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--rosa-kloe);
            padding: 5px 10px;
            border-radius: 50%;
            font-size: 0.8rem;
            color: white;
        }

        .carrito-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 30px rgba(0,0,0,0.1);
            z-index: 2000;
            transition: var(--transicion);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .carrito-panel.abierto { right: 0; }

        .lista-carrito {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 20px;
        }

        .total-seccion {
            border-top: 2px solid var(--rosa-claro);
            padding: 20px 0;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #modal-desc {
            color: #777;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-contenedor"><img src="Kloe-logo.jpg" alt="Kloe Beauty Logo" class="logo-imagen"></div>
        <h1 class="logo-texto">Kloe Beauty</h1>
    </header>

    <section class="dashboard">
        <div class="filtros-scroll" id="filtros">
            <button class="btn-filtro activo" onclick="filtrar('todos')">Todos</button>
            <button class="btn-filtro" onclick="filtrar('labiales')">Labiales</button>
            <button class="btn-filtro" onclick="filtrar('rostro')">Rostro</button>
            <button class="btn-filtro" onclick="filtrar('ojos')">Ojos</button>
            <button class="btn-filtro" onclick="filtrar('cabello')">Cabello</button>
        </div>
    </section>

    <main class="contenedor">
        <div class="grid-productos" id="lista-productos"></div>
    </main>

    <div id="modal-detalle" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:3000; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;">
        <div style="background:white; width:100%; max-width:420px; border-radius:30px; padding:30px; position:relative; text-align:center; box-shadow: 0 20px 50px rgba(0,0,0,0.3);">
            <button onclick="cerrarModal()" style="position:absolute; top:20px; right:20px; border:none; background:#eee; width:35px; height:35px; border-radius:50%; font-size:1rem; cursor:pointer;">✕</button>
            
            <div style="width:100%; height:230px; display:flex; align-items:center; justify-content:center; background:var(--rosa-claro); border-radius:20px; margin-bottom:20px;">
                <img id="modal-img" src="" style="max-width:95%; max-height:95%; object-fit:contain;">
            </div>

            <h2 id="modal-nombre" style="margin:0; font-size:1.4rem;"></h2>
            <p id="modal-desc"></p>
            
            <div id="seccion-tonos">
                <p style="font-weight:600; font-size:0.9rem; margin-bottom:5px;">Selecciona tu tono:</p>
                <div class="contenedor-tonos" id="contenedor-tonos"></div>
            </div>

            <h3 id="modal-precio" style="color:var(--rosa-kloe); font-size:1.6rem; margin:10px 0 20px 0;"></h3>
            <button class="btn-comprar" id="btn-modal-agregar">Añadir al Carrito</button>
        </div>
    </div>

    <div class="carrito-flotante" onclick="toggleCarrito()">
        🛒 <span class="contador-badge" id="cart-count">0</span>
    </div>

    <div class="carrito-panel" id="cart-panel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin:0;">Tu Carrito</h2>
            <button onclick="toggleCarrito()" style="border:none; background:none; cursor:pointer; font-size:1.5rem;">✕</button>
        </div>
        <div class="lista-carrito" id="cart-items"></div>
        <div class="total-seccion">
            <h3 style="display:flex; justify-content:space-between;">Total: <span id="cart-total">$ 0</span></h3>
            <button class="btn-whatsapp" onclick="enviarWhatsApp()">Finalizar pedido por WhatsApp</button>
        </div>
    </div>

    <script>
        const formatoCOP = new Intl.NumberFormat('es-CO', {
            style: 'currency', currency: 'COP', minimumFractionDigits: 0
        });

        const URL_GOOGLE_SHEETS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTwgcsxDAYDYMqWZ5qkl65R_Jpzg-FeKu8G-8HxegRO2wsaQqRSIzbJfS_iL_VDUGFumMyiA6SR2mAa/pub?output=csv";
        const numeroWhatsApp = "573176035545";
        let productos = [];
        let carrito = [];
        let tonoSeleccionadoGlobal = "";

        async function cargarProductos() {
            try {
                const respuesta = await fetch(URL_GOOGLE_SHEETS);
                const datosCSV = await respuesta.text();
                const filas = datosCSV.split(/\r?\n/).slice(1);
                
                productos = filas.map(fila => {
                    const columnas = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (!columnas || columnas.length < 3) return null;

                    const nombre = columnas[1]?.replace(/"/g, '').trim() || "Producto";
                    const precio = columnas[2] ? parseInt(columnas[2].replace(/"/g, '').replace(/\D/g, '')) : 0;
                    const cat = columnas[3]?.replace(/"/g, '').trim().toLowerCase() || 'otros';
                    const foto = columnas[4]?.replace(/"/g, '').trim() || '';
                    const esDisponible = columnas[5]?.replace(/"/g, '').trim().toLowerCase() !== 'agotado';
                    const desc = columnas[6]?.replace(/"/g, '').trim() || "Calidad premium.";

                    let tonos = [];
                    for(let i = 7; i < columnas.length; i++) {
                        let colorStr = columnas[i]?.replace(/"/g, '').trim();
                        if (colorStr) {
                            if (colorStr.includes('|')) {
                                colorStr.split('|').forEach(c => tonos.push(c.trim()));
                            } else {
                                tonos.push(colorStr);
                            }
                        }
                    }

                    return { nombre, precio, cat, foto, disponible: esDisponible, desc, tonos };
                }).filter(p => p !== null);

                renderizar(productos);
            } catch (error) { console.error("Error:", error); }
        }

        function renderizar(lista) {
            const contenedor = document.getElementById('lista-productos');
            contenedor.innerHTML = '';
            lista.forEach((p, index) => {
                const img = p.foto && p.foto.startsWith('http') ? p.foto : 'Kloe-logo.jpg';
                contenedor.insertAdjacentHTML('beforeend', `
                    <div class="card visible" style="transition-delay: ${index * 0.05}s">
                        <div onclick="verDetalle('${p.nombre.replace(/'/g, "\\'")}')" style="cursor:pointer;">
                            <img src="${img}" onerror="this.src='Kloe-logo.jpg'" style="width:100%; height:210px; object-fit:cover; border-radius:15px;">
                            <h3 style="font-weight:400; font-size:1rem; margin:12px 0 5px;">${p.nombre}</h3>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                            <span style="font-weight:600;">${formatoCOP.format(p.precio)}</span>
                            <button class="btn-comprar" onclick="verDetalle('${p.nombre.replace(/'/g, "\\'")}')" 
                                style="width:auto; padding:8px 15px; font-size:0.8rem; ${p.disponible ? '' : 'background:#ccc;'}" ${p.disponible ? '' : 'disabled'}>
                                ${p.disponible ? 'Ver Más' : 'Agotado'}
                            </button>
                        </div>
                    </div>
                `);
            });
        }

        function verDetalle(nombre) {
            const p = productos.find(prod => prod.nombre === nombre);
            if (!p) return;

            document.getElementById('modal-img').src = p.foto || 'Kloe-logo.jpg';
            document.getElementById('modal-nombre').innerText = p.nombre;
            document.getElementById('modal-desc').innerText = p.desc;
            document.getElementById('modal-precio').innerText = formatoCOP.format(p.precio);
            
            const contenedor = document.getElementById('contenedor-tonos');
            contenedor.innerHTML = "";
            
            if (p.tonos && p.tonos.length > 0) {
                document.getElementById('seccion-tonos').style.display = 'block';
                tonoSeleccionadoGlobal = p.tonos[0];

                p.tonos.forEach((tono, i) => {
                    const div = document.createElement('div');
                    div.className = `circulo-tono ${i === 0 ? 'seleccionado' : ''}`;
                    div.style.backgroundColor = tono;
                    div.title = tono;
                    div.onclick = function() {
                        document.querySelectorAll('.circulo-tono').forEach(c => c.classList.remove('seleccionado'));
                        this.classList.add('seleccionado');
                        tonoSeleccionadoGlobal = tono;
                    };
                    contenedor.appendChild(div);
                });
            } else {
                document.getElementById('seccion-tonos').style.display = 'none';
                tonoSeleccionadoGlobal = "Estándar";
            }

            document.getElementById('btn-modal-agregar').onclick = () => {
                carrito.push({ ...p, tonoElegido: tonoSeleccionadoGlobal });
                cerrarModal();
                actualizarInterfaz();
                toggleCarrito();
            };

            document.getElementById('modal-detalle').style.display = 'flex';
        }

        function cerrarModal() { document.getElementById('modal-detalle').style.display = 'none'; }

        function actualizarInterfaz() {
            document.getElementById('cart-count').innerText = carrito.length;
            const listaHTML = document.getElementById('cart-items');
            listaHTML.innerHTML = '';
            let total = 0;
            carrito.forEach((p, index) => {
                total += p.precio;
                listaHTML.innerHTML += `
                    <div style="display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid #eee;">
                        <div style="width:18px; height:18px; border-radius:50%; background:${p.tonoElegido === 'Estándar' ? 'var(--rosa-kloe)' : p.tonoElegido}; border:1px solid #ddd;"></div>
                        <div style="flex-grow:1; text-align:left;">
                            <div style="font-size:0.85rem; font-weight:600;">${p.nombre}</div>
                            <div style="font-size:0.75rem; color:#888;">Tono: ${p.tonoElegido}</div>
                        </div>
                        <button onclick="eliminarDelCarrito(${index})" style="border:none; background:none; color:#ff4d4d; cursor:pointer; font-size:1.1rem;">✕</button>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = formatoCOP.format(total);
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarInterfaz();
        }

        function enviarWhatsApp() {
            if (carrito.length === 0) return alert("¡Tu carrito está vacío!");
            let mensaje = "✨ *NUEVO PEDIDO - KLOE BEAUTY* ✨\n\nHola, quiero pedir:\n";
            carrito.forEach((p, i) => {
                mensaje += `🛍️ *${i+1}.* ${p.nombre}\n   🎨 Tono: ${p.tonoElegido}\n   💰 ${formatoCOP.format(p.precio)}\n`;
            });
            mensaje += `\n💵 *TOTAL: ${document.getElementById('cart-total').innerText}*`;
            window.open(`https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        function filtrar(categoria) {
            document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo'));
            event.target.classList.add('activo');
            renderizar(categoria === 'todos' ? productos : productos.filter(p => p.cat === categoria));
        }

        function toggleCarrito() { document.getElementById('cart-panel').classList.toggle('abierto'); }

        cargarProductos();
    </script>
</body>
</html>
